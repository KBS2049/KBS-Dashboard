name: Build multi-user UI

on:
  push:
    branches: [multi-user-v2]

permissions:
  contents: write

jobs:
  patch-ui:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('</script>>','</script>')
          # Keep the current design and only patch the authentication UI behavior.
          # The branch is isolated from production while this work is being validated.
          p.write_text(s)
          PY
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix multi-user UI script [skip ci]"
          git push
