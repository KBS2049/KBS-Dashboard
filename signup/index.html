<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up - KBS Studio</title><style>body{margin:0;min-height:100vh;background:#0f0f0f;color:#f1f1f1;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}.card{width:min(390px,calc(100% - 32px));padding:34px;background:#181818;border:1px solid #303030;border-radius:16px;text-align:center}.logo{width:72px;height:72px;border-radius:12px;margin-bottom:18px}.card h1{font-size:22px;margin:0 0 8px}.card p{font-size:13px;color:#aaa;margin:0 0 24px}.fields{display:grid;gap:10px}.fields input{height:44px;padding:0 12px;background:#111;color:#fff;border:1px solid #3d3d3d;border-radius:8px;outline:0}.fields input:focus{border-color:#fff}button{height:44px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:600;cursor:pointer}.error{min-height:20px;margin-top:12px;color:#ff6b6b;font-size:13px}.foot{margin-top:18px;color:#888;font-size:13px}.foot a{color:#fff}</style></head><body><div class="card"><img class="logo" src="/icon.png" onerror="this.style.display='none'"><h1>Create your KBS Studio account</h1><p>Sign up, then connect your YouTube channel.</p><div class="fields"><input id="u" autocomplete="username" placeholder="Username"><input id="p" type="password" autocomplete="new-password" placeholder="Password (8+ characters)"><input id="p2" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="b" onclick="signup()">Create account</button></div><div class="error" id="e"></div><div class="foot">Already have an account? <a href="/">Sign in</a></div></div><script>async function signup(){const b=document.getElementById('b'),e=document.getElementById('e'),u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,p2=document.getElementById('p2').value;e.textContent='';if(!u||!p){e.textContent='Enter username and password';return}if(p!==p2){e.textContent='Passwords do not match';return}b.disabled=true;b.textContent='Creating account…';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'signup',username:u,password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Signup failed');location.href='/'}catch(x){e.textContent=x.message==='username_exists'?'Username already exists':x.message==='username_3_32_and_password_8_required'?'Username must be 3-32 characters and password must be 8+ characters':'Could not create account'}finally{b.disabled=false;b.textContent='Create account'}}document.getElementById('p2').addEventListener('keydown',x=>{if(x.key==='Enter')signup()})</script></body></html>
