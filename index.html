<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KBS Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#0a0a0a; --card:#1a1a1a; --card2:#151515; --text:#fff; --sub:#9c9c9c;
    --accent:#22c1e0; --border:#242424; --green:#3ddc84;
    --c-views:#3ea6ff; --c-subs:#a76bf0; --c-watch:#ff5fa2; --c-rev:#20d3a8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{padding-top:env(safe-area-inset-top); background:var(--bg);}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:40px; -webkit-font-smoothing:antialiased;}

  #pinScreen{position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #141414, #000 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100;}
  #pinScreen img{width:64px; height:64px; border-radius:16px; margin-bottom:18px;}
  #pinScreen h2{font-weight:600; margin:0 0 26px;}
  .pinBoxes{display:flex; gap:14px;}
  .pinBoxes input{width:48px; height:56px; text-align:center; font-size:24px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:#fff;}
  .pinBoxes input:focus{border-color:var(--accent); outline:none;}
  #pinError{color:#ff5252; font-size:13px; margin-top:16px; height:16px;}

  header{display:flex; align-items:center; gap:10px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top)); position:sticky; top:0; background:rgba(10,10,10,0.9); backdrop-filter:blur(12px); z-index:10; border-bottom:1px solid var(--border);}
  header img.logo{width:26px; height:26px; border-radius:6px;}
  header h1{font-size:17px; margin:0; font-weight:700;}
  .backbtn{font-size:20px; background:none; border:none; color:var(--text); cursor:pointer; padding:2px 8px; border-radius:8px;}
  .refreshBtn{margin-left:auto; font-size:17px; background:var(--card); border:1px solid var(--border); color:var(--text); cursor:pointer; padding:6px 10px; line-height:1; border-radius:10px;}
  .refreshBtn.spinning{animation:sp .7s linear infinite;}

  #channelScroller{display:flex; gap:14px; overflow-x:auto; padding:12px 16px; border-bottom:1px solid var(--border);}
  #channelScroller::-webkit-scrollbar{display:none;}
  .chip{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:56px; cursor:pointer; opacity:.5;}
  .chip.active{opacity:1;}
  .chip img{width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid transparent;}
  .chip.active img{border-color:var(--accent);}
  .chip span{font-size:10.5px; color:var(--sub); max-width:56px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.active span{color:var(--text); font-weight:600;}
  .addchip{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:56px; cursor:pointer;}
  .addchip .plus{width:44px; height:44px; border-radius:50%; border:1.5px dashed #3a3a3a; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--sub);}

  main{padding:16px; animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}

  .subcount{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .subcount img{width:50px; height:50px; border-radius:50%;}
  .subcount .num{font-size:20px; font-weight:700;}
  .subcount .lbl{font-size:12px; color:var(--sub);}

  .tabbar{display:flex; gap:4px; overflow-x:auto; margin:10px 0 16px; border-bottom:1px solid var(--border);}
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{flex-shrink:0; padding:8px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tabbtn.active{color:#fff; border-color:var(--accent);}

  h2.section{font-size:14.5px; margin:20px 0 10px; font-weight:700; color:#ddd;}
  .section .hint{color:var(--sub); font-weight:400; font-size:11.5px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .card{background:linear-gradient(155deg,#1c1c1c,#131313); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .card .k{font-size:12px; color:var(--sub); margin-bottom:6px;}
  .card .v{font-size:19px; font-weight:700;}

  /* Carousel */
  .carouselWrap{margin:0;}
  .carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:0; border-radius:14px; -webkit-overflow-scrolling:touch;}
  .carousel::-webkit-scrollbar{display:none;}
  .statCard{min-width:100%; scroll-snap-align:start; background:linear-gradient(155deg,#1c1c1c,#131313); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .statCard .lbl{font-size:13px; color:var(--sub);}
  .statCard .big{font-size:26px; font-weight:700; margin:4px 0 10px;}
  .dots{display:flex; justify-content:center; gap:6px; margin-top:10px;}
  .dot{width:6px; height:6px; border-radius:50%; background:#333;}
  .dot.active{background:var(--accent); width:16px; border-radius:3px; transition:all .2s;}

  .vidrow{display:flex; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:10px; cursor:pointer;}
  .vidrow:active{background:#202020;}
  .vidrow img{width:60px; height:60px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .vidrow .info{flex:1; min-width:0;}
  .vidrow .title{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.3;}
  .vidrow .meta{font-size:11.5px; color:var(--sub); margin-top:5px; display:flex; align-items:center; flex-wrap:wrap; gap:8px;}
  .rank{font-size:10.5px; background:rgba(62,166,255,0.14); padding:2px 7px; border-radius:6px; color:#7cc4ff; font-weight:600; cursor:pointer;}

  .statline{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border);}
  .statline .k{color:var(--sub); font-size:13px;}
  .statline .v{font-size:14.5px; font-weight:600;}

  .chartWrap{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 10px;}
  svg{width:100%; display:block;}

  /* segmented bar */
  .segBar{display:flex; height:9px; border-radius:5px; overflow:hidden; margin-bottom:12px;}
  .legendList .legendRow{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px; border-bottom:1px solid var(--border);}
  .legendList .legendRow:last-child{border-bottom:none;}
  .legendRow .sdot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .legendRow .lbl{flex:1; color:#ddd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legendRow .val{color:var(--sub); font-variant-numeric:tabular-nums; font-size:12.5px;}

  .srcbar{margin:12px 0;}
  .srcbar .row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .srcbar .bg{height:6px; background:#242424; border-radius:4px; overflow:hidden;}
  .srcbar .fg{height:100%; border-radius:4px; transition:width .5s ease;}

  .rankList{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .rankRow{display:flex; align-items:center; gap:12px; padding:11px 12px; border-bottom:1px solid var(--border);}
  .rankRow:last-child{border-bottom:none;}
  .rankRow.current{background:rgba(62,166,255,0.08);}
  .rankRow .num{width:20px; color:var(--sub); font-size:13px; text-align:center;}
  .rankRow img{width:40px; height:40px; border-radius:6px; object-fit:cover;}
  .rankRow .t{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rankRow .vw{font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums;}

  .center{text-align:center; padding:60px 20px; color:var(--sub);}
  .btn{background:var(--accent); color:#000; border:none; padding:12px 22px; border-radius:24px; font-weight:700; font-size:15px; cursor:pointer;}
  .note{font-size:11px; color:var(--sub); margin-top:6px;}
  .skel{background:linear-gradient(90deg,#181818 25%,#222 37%,#181818 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:10px;}
  @keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}
  @keyframes sp{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="pinScreen">
  <img src="icon.png">
  <h2>Enter PIN</h2>
  <div class="pinBoxes">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
  </div>
  <div id="pinError"></div>
</div>

<header>
  <button class="backbtn hidden" id="backBtn" onclick="goBack()">←</button>
  <img class="logo" src="icon.png" onerror="this.style.display='none'">
  <h1 id="headerTitle">KBS Dashboard</h1>
  <button class="refreshBtn" id="refreshBtn" onclick="refreshCurrent()">⟳</button>
</header>

<div id="channelScroller"></div>
<main id="main"></main>

<script>
const PIN = "4679";
const boxes = document.querySelectorAll('.pinBoxes input');
boxes[0].focus();
boxes.forEach((b,i)=>{
  b.addEventListener('input', ()=>{
    b.value = b.value.replace(/[^0-9]/g,'');
    if(b.value && i<boxes.length-1) boxes[i+1].focus();
    if([...boxes].every(x=>x.value.length===1)) checkPin();
  });
  b.addEventListener('keydown', (e)=>{ if(e.key==='Backspace' && !b.value && i>0) boxes[i-1].focus(); });
});
function checkPin(){
  const entered = [...boxes].map(b=>b.value).join('');
  if(entered === PIN){ document.getElementById('pinScreen').style.display='none'; init(); }
  else { document.getElementById('pinError').textContent='Galat PIN'; boxes.forEach(b=>b.value=''); boxes[0].focus(); }
}

let channels = [];
let activeIdx = null;
let stack = []; // navigation stack: {view:'dashboard'|'video'|'ranking', ...}
let lastChanData = null;
let activeChanTab = 'overview';
let activeVidTab = 'overview';

function refreshCurrent(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const done = ()=> btn.classList.remove('spinning');
  const top = stack[stack.length-1];
  if(!top || top.view==='dashboard'){ if(activeIdx!==null) loadChannel(activeIdx).then(done); else done(); }
  else if(top.view==='video'){ openVideo(top.chan, top.video, top.allVideos, true).then(done); }
  else done();
}

async function init(){
  channels = await (await fetch('/api/channels', {cache:'no-store'})).json();
  activeIdx = channels.length ? 0 : null;
  renderChips();
  if(activeIdx!==null) loadChannel(activeIdx);
  else document.getElementById('main').innerHTML = `<div class="center"><p>Koi channel connect nahi hai.</p><button class="btn" onclick="location.href='/api/login'">+ Connect Channel</button></div>`;
}

function renderChips(){
  const el = document.getElementById('channelScroller');
  el.innerHTML = '';
  channels.forEach((c,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip'+(i===activeIdx?' active':'');
    chip.innerHTML = `<img src="${c.thumb}"><span>${c.title}</span>`;
    chip.onclick = ()=>{ activeIdx=i; activeChanTab='overview'; stack=[]; renderChips(); loadChannel(i); };
    el.appendChild(chip);
  });
  const add = document.createElement('div');
  add.className = 'addchip';
  add.innerHTML = `<div class="plus">+</div><span>Add</span>`;
  add.onclick = ()=> location.href='/api/login';
  el.appendChild(add);
}

function goBack(){
  stack.pop();
  const top = stack[stack.length-1];
  if(!top){
    document.getElementById('backBtn').classList.add('hidden');
    document.getElementById('headerTitle').textContent = 'KBS Dashboard';
    if(activeIdx!==null) loadChannel(activeIdx);
  } else if(top.view==='video'){
    document.getElementById('headerTitle').textContent = 'Video';
    renderVideo(top);
  } else if(top.view==='ranking'){
    document.getElementById('headerTitle').textContent = 'Rankings';
    renderRanking(top);
  }
}

function fmt(n){ n=Number(n||0); if(n>=1e6) return (n/1e6).toFixed(1)+'m'; if(n>=1e3) return (n/1e3).toFixed(1)+'k'; return n.toLocaleString(); }
function fmtDuration(sec){ if(!sec) return '—'; sec=Math.round(sec); return `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`; }
function timeAgo(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; return Math.floor(s/3600)+'h ago'; }
function skeleton(){ return `<div class="skel" style="height:50px;border-radius:50%;width:50px;margin-bottom:16px;"></div><div class="grid2"><div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div></div><div class="skel" style="height:150px;margin-top:20px;"></div>`; }

async function loadChannel(idx){
  stack = [];
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('headerTitle').textContent = 'KBS Dashboard';
  const chan = channels[idx];
  document.getElementById('main').innerHTML = skeleton();
  const d = await (await fetch('/api/data?channelId='+chan.id, {cache:'no-store'})).json();
  lastChanData = { chan, d };
  renderDashboard(chan, d);
}

function switchChanTab(tab){ activeChanTab = tab; renderDashboard(lastChanData.chan, lastChanData.d); }

function renderDashboard(chan, d){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="subcount"><img src="${d.thumb}"><div><div class="num">${fmt(d.subs)}</div><div class="lbl">Total subscribers · ${fmt(d.videoCount)} videos</div></div></div>
    <div class="tabbar">
      <div class="tabbtn ${activeChanTab==='overview'?'active':''}" onclick="switchChanTab('overview')">Overview</div>
      <div class="tabbtn ${activeChanTab==='audience'?'active':''}" onclick="switchChanTab('audience')">Audience</div>
      <div class="tabbtn ${activeChanTab==='content'?'active':''}" onclick="switchChanTab('content')">Content</div>
    </div>
    <div id="tabBody"></div>
    <div class="note" style="text-align:center;margin-top:16px;">Updated ${timeAgo(d.fetchedAt)} · YouTube processes analytics with a 24–48h delay</div>`;
  const body = document.getElementById('tabBody');
  if(activeChanTab==='overview') renderChanOverview(body, chan, d);
  else if(activeChanTab==='audience') renderChanAudience(body, d);
  else renderChanContent(body, chan, d);
}

function renderChanOverview(body, chan, d){
  body.innerHTML = `
    <div class="carouselWrap">
      <div class="carousel" id="cOv">
        <div class="statCard"><div class="lbl">Views</div><div class="big" style="color:var(--c-views)">${fmt(d.analytics.views)}</div><svg class="lineS" viewBox="0 0 300 90" preserveAspectRatio="none" id="ovViews"></svg></div>
        <div class="statCard"><div class="lbl">Watch time (hours)</div><div class="big" style="color:var(--c-watch)">${fmt(d.analytics.estimatedMinutesWatched/60)}</div><svg class="lineS" viewBox="0 0 300 90" preserveAspectRatio="none" id="ovWatch"></svg></div>
        <div class="statCard"><div class="lbl">Subscribers gained</div><div class="big" style="color:var(--c-subs)">+${fmt(d.analytics.subscribersGained)}</div><div class="note">Last 28 days</div></div>
        <div class="statCard"><div class="lbl">Estimated revenue</div><div class="big" style="color:var(--c-rev)">$${fmt(d.analytics.estimatedRevenue)}</div><div class="note">Last 28 days</div></div>
      </div>
      <div class="dots" id="cOvdots"></div>
    </div>
    <h2 class="section">Latest content</h2>
    <div id="vidlist"></div>
    <h2 class="section">Lifetime</h2>
    <div class="grid2">
      <div class="card"><div class="k">Total views</div><div class="v">${fmt(d.totalViews)}</div></div>
      <div class="card"><div class="k">Total videos</div><div class="v">${fmt(d.videoCount)}</div></div>
    </div>`;
  initCarousel('cOv', 4);
  drawLine('ovViews', d.dailyViews.map(r=>Number(r[1])), '#3ea6ff');
  const vl = document.getElementById('vidlist');
  d.videos.slice(0,4).forEach(v=>{
    const row = document.createElement('div');
    row.className = 'vidrow';
    row.innerHTML = `<img src="${v.snippet.thumbnails.default.url}"><div class="info"><div class="title">${v.snippet.title}</div>
      <div class="meta"><span>${fmt(v.statistics.viewCount)} views</span><span>·</span><span>${fmt(v.statistics.likeCount)} likes</span><span class="rank">#${v.rankByViews} of ${d.videos.length}</span></div></div>`;
    row.querySelector('.rank').onclick = (e)=>{ e.stopPropagation(); openRanking(chan, d.videos, v.id); };
    row.onclick = ()=> openVideo(chan, v, d.videos);
    vl.appendChild(row);
  });
}

function renderChanAudience(body, d){
  body.innerHTML = `
    <h2 class="section">Traffic sources</h2><div class="chartWrap" id="srcBox"></div>
    <h2 class="section">Top countries</h2><div class="chartWrap" id="geoBox"></div>
    <h2 class="section">Devices</h2><div class="chartWrap" id="devBox"></div>
    <h2 class="section">Subscribed vs not</h2><div class="chartWrap" id="subBox"></div>
    <h2 class="section">Age &amp; gender</h2><div class="chartWrap" id="demoBox"></div>`;
  fillBars('srcBox', d.trafficSources, '#3ea6ff');
  fillBars('geoBox', d.countries, '#20d3a8');
  fillBars('devBox', d.devices, '#a76bf0');
  fillBars('subBox', d.subscribedStatus.map(r=>[r[0]==='SUBSCRIBED'?'Subscribed':'Not subscribed', r[1]]), '#ff5fa2');
  fillDemo('demoBox', d.demographics);
}

function renderChanContent(body, chan, d){
  body.innerHTML = `<div id="vidlistFull"></div><h2 class="section">Playlists by views</h2><div class="chartWrap" id="playlistBox"></div>`;
  const vl = document.getElementById('vidlistFull');
  d.videos.forEach(v=>{
    const row = document.createElement('div');
    row.className = 'vidrow';
    row.innerHTML = `<img src="${v.snippet.thumbnails.default.url}"><div class="info"><div class="title">${v.snippet.title}</div>
      <div class="meta"><span>${fmt(v.statistics.viewCount)} views</span><span>·</span><span>${fmt(v.statistics.likeCount)} likes</span><span class="rank">#${v.rankByViews} of ${d.videos.length}</span></div></div>`;
    row.querySelector('.rank').onclick = (e)=>{ e.stopPropagation(); openRanking(chan, d.videos, v.id); };
    row.onclick = ()=> openVideo(chan, v, d.videos);
    vl.appendChild(row);
  });
  fillBars('playlistBox', d.playlists, '#3ea6ff');
}

function openRanking(chan, allVideos, currentId){
  stack.push({ view:'ranking', chan, allVideos, currentId });
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('headerTitle').textContent = 'Rankings';
  renderRanking(stack[stack.length-1]);
}

function renderRanking(ctx){
  const sorted = [...ctx.allVideos].sort((a,b)=>b.statistics.viewCount-a.statistics.viewCount);
  const main = document.getElementById('main');
  main.innerHTML = `<h2 class="section" style="margin-top:4px;">Top recent videos <span class="hint">by views</span></h2><div class="rankList" id="rankList"></div>`;
  const rl = document.getElementById('rankList');
  sorted.forEach((v,i)=>{
    const row = document.createElement('div');
    row.className = 'rankRow'+(v.id===ctx.currentId?' current':'');
    row.innerHTML = `<div class="num">${i+1}</div><img src="${v.snippet.thumbnails.default.url}"><div class="t">${v.snippet.title}</div><div class="vw">${fmt(v.statistics.viewCount)}</div>`;
    row.onclick = ()=> openVideo(ctx.chan, v, ctx.allVideos);
    rl.appendChild(row);
  });
}

async function openVideo(chan, video, allVideos, silent){
  if(!silent){
    stack.push({ view:'video', chan, video, allVideos });
    activeVidTab = 'overview';
  }
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('headerTitle').textContent = 'Video';
  const main = document.getElementById('main');
  main.innerHTML = skeleton();
  const q = new URLSearchParams({ channelId: chan.id, videoId: video.id, publishedAt: video.snippet.publishedAt });
  const vd = await (await fetch('/api/video?'+q, {cache:'no-store'})).json();
  const ctx = { view:'video', chan, video, allVideos, vd };
  if(stack.length && stack[stack.length-1].view==='video') stack[stack.length-1] = ctx;
  renderVideo(ctx);
}

function switchVidTab(tab){ activeVidTab = tab; renderVideo(stack[stack.length-1]); }

function renderVideo(ctx){
  const { chan, video, allVideos, vd } = ctx;
  const rank = video.rankByViews;
  const e = vd.extra || {};
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:14px;">
      <img src="${video.snippet.thumbnails.medium.url}" style="width:90px;border-radius:10px;">
      <div><div style="font-weight:600;font-size:13.5px;line-height:1.35;">${video.snippet.title}</div>
      <div class="note">Rank <span class="rank" style="cursor:pointer;" onclick="openRanking(chanG,allVidsG,'${video.id}')">#${rank} of ${allVideos.length}</span> · ${new Date(video.snippet.publishedAt).toLocaleDateString()}</div></div>
    </div>
    <div class="tabbar">
      <div class="tabbtn ${activeVidTab==='overview'?'active':''}" onclick="switchVidTab('overview')">Overview</div>
      <div class="tabbtn ${activeVidTab==='reach'?'active':''}" onclick="switchVidTab('reach')">Reach</div>
      <div class="tabbtn ${activeVidTab==='engagement'?'active':''}" onclick="switchVidTab('engagement')">Engagement</div>
      <div class="tabbtn ${activeVidTab==='audience'?'active':''}" onclick="switchVidTab('audience')">Audience</div>
      <div class="tabbtn ${activeVidTab==='revenue'?'active':''}" onclick="switchVidTab('revenue')">Revenue</div>
    </div>
    <div id="vidTabBody"></div>
    <div class="note" style="text-align:center;margin-top:14px;">Updated ${timeAgo(vd.fetchedAt)} · YouTube processes analytics with a 24–48h delay</div>`;
  window.chanG = chan; window.allVidsG = allVideos;
  const body = document.getElementById('vidTabBody');

  if(activeVidTab==='overview'){
    body.innerHTML = `
      <div class="carouselWrap"><div class="carousel" id="vOv">
        <div class="statCard"><div class="lbl">Views</div><div class="big" style="color:var(--c-views)">${fmt(video.statistics.viewCount)}</div><svg class="lineS" viewBox="0 0 300 90" preserveAspectRatio="none" id="vOvViews"></svg></div>
        <div class="statCard"><div class="lbl">Subscribers gained</div><div class="big" style="color:var(--c-subs)">+${fmt(e.subscribersGained)}</div><svg class="lineS" viewBox="0 0 300 90" preserveAspectRatio="none" id="vOvSubs"></svg></div>
      </div><div class="dots" id="vOvdots"></div></div>
      <h2 class="section">Likes &amp; comments</h2>
      <div class="statline"><span class="k">Likes</span><span class="v">${fmt(video.statistics.likeCount)}</span></div>
      <div class="statline"><span class="k">Comments</span><span class="v">${fmt(video.statistics.commentCount)}</span></div>
      <div class="statline"><span class="k">Shares</span><span class="v">${fmt(e.shares)}</span></div>`;
    initCarousel('vOv', 2);
    drawLine('vOvViews', vd.viewsSeries.map(r=>Number(r[1])), '#3ea6ff');
    drawLine('vOvSubs', vd.subsSeries.map(r=>Number(r[1])), '#a76bf0');
  }
  else if(activeVidTab==='reach'){
    body.innerHTML = `
      <h2 class="section">Views</h2><div class="chartWrap"><svg viewBox="0 0 300 110" id="reachViews"></svg></div>
      <h2 class="section">How viewers find this video</h2><div class="chartWrap" id="reachSrc"></div>
      <h2 class="section">External sites or apps</h2><div class="chartWrap" id="extApps"></div>
      <h2 class="section">YouTube search terms</h2><div class="chartWrap" id="searchTerms"></div>`;
    drawLine('reachViews', vd.viewsSeries.map(r=>Number(r[1])), '#3ea6ff');
    segBar('reachSrc', vd.sources);
    fillBars('extApps', vd.externalApps, '#a76bf0');
    fillBars('searchTerms', vd.searchTerms, '#20d3a8');
  }
  else if(activeVidTab==='engagement'){
    body.innerHTML = `
      <div class="carouselWrap"><div class="carousel" id="vEng">
        <div class="statCard"><div class="lbl">Watch time (hours)</div><div class="big" style="color:var(--c-watch)">${fmt((e.estimatedMinutesWatched||0)/60)}</div><svg class="lineS" viewBox="0 0 300 90" id="engWatch"></svg></div>
        <div class="statCard"><div class="lbl">Average view duration</div><div class="big" style="color:var(--c-watch)">${fmtDuration(e.averageViewDuration)}</div><div class="note">${e.averageViewPercentage ? e.averageViewPercentage.toFixed(1)+'% of video watched on average' : ''}</div></div>
      </div><div class="dots" id="vEngdots"></div></div>
      <h2 class="section">Engagement totals</h2>
      <div class="statline"><span class="k">Likes</span><span class="v">${fmt(e.likes)}</span></div>
      <div class="statline"><span class="k">Comments</span><span class="v">${fmt(e.comments)}</span></div>
      <div class="statline"><span class="k">Shares</span><span class="v">${fmt(e.shares)}</span></div>`;
    initCarousel('vEng', 2);
    drawLine('engWatch', vd.watchSeries.map(r=>Number(r[1])), '#ff5fa2');
  }
  else if(activeVidTab==='audience'){
    body.innerHTML = `
      <h2 class="section">Device type</h2><div class="chartWrap" id="audDev"></div>
      <h2 class="section">Age &amp; gender</h2><div class="chartWrap" id="audDemo"></div>
      <h2 class="section">Top geographies</h2><div class="chartWrap" id="audGeo"></div>`;
    segBar('audDev', vd.devices);
    fillDemo('audDemo', vd.demographics);
    fillBars('audGeo', vd.countries, '#20d3a8');
  }
  else if(activeVidTab==='revenue'){
    const adRev = e.estimatedAdRevenue || 0, totalRev = e.estimatedRevenue || 0, otherRev = Math.max(0, totalRev-adRev);
    body.innerHTML = `
      <div class="carouselWrap"><div class="carousel" id="vRev">
        <div class="statCard"><div class="lbl">Estimated revenue</div><div class="big" style="color:var(--c-rev)">$${fmt(totalRev)}</div><svg class="lineS" viewBox="0 0 300 90" id="revChart"></svg></div>
      </div></div>
      <h2 class="section">How you make money</h2><div class="chartWrap" id="revSplit"></div>`;
    drawLine('revChart', vd.revSeries.map(r=>Number(r[1])), '#20d3a8');
    segBar('revSplit', [['Ad revenue', adRev],['Other', otherRev]], ['#20d3a8','#0f7a63']);
  }
}

function initCarousel(id, count){
  const el = document.getElementById(id);
  const dotsEl = document.getElementById(id+'dots');
  if(dotsEl) dotsEl.innerHTML = Array.from({length:count}).map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join('');
  el.addEventListener('scroll', ()=>{
    const idx = Math.round(el.scrollLeft/el.clientWidth);
    if(dotsEl) dotsEl.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
  });
}

function drawLine(id, data, color){
  const svg = document.getElementById(id);
  if(!svg) return;
  if(!data.length){ svg.outerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  const w=300,h=90;
  let cum=[],running=0; data.forEach(v=>{running+=v;cum.push(running);});
  const cmax = Math.max(...cum,1);
  const pts = cum.map((v,i)=> `${(i/(cum.length-1||1))*w},${h-(v/cmax*h)}`).join(' ');
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function fillBars(elId, rows, color){
  const el = document.getElementById(elId);
  if(!el) return;
  if(!rows || !rows.length){ el.innerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  el.innerHTML = '';
  const maxV = Math.max(1,...rows.map(s=>Number(s[1])));
  rows.forEach(s=>{
    const pct = (Number(s[1])/maxV*100).toFixed(0);
    const div = document.createElement('div');
    div.className = 'srcbar';
    div.innerHTML = `<div class="row"><span>${s[0]}</span><span>${fmt(s[1])}</span></div><div class="bg"><div class="fg" style="width:0%;background:${color}"></div></div>`;
    el.appendChild(div);
    requestAnimationFrame(()=>{ div.querySelector('.fg').style.width = pct+'%'; });
  });
}

function segBar(elId, rows, palette){
  const el = document.getElementById(elId);
  if(!rows || !rows.length){ el.innerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  const colors = palette || ['#a76bf0','#8a5ce0','#c17ef0','#e08cf0','#7a7a7a','#5a5a5a'];
  const total = rows.reduce((s,r)=>s+Number(r[1]),0) || 1;
  const bar = rows.map((r,i)=>`<div style="width:${(Number(r[1])/total*100)}%;background:${colors[i%colors.length]}"></div>`).join('');
  const legend = rows.map((r,i)=>`<div class="legendRow"><span class="sdot" style="background:${colors[i%colors.length]}"></span><span class="lbl">${r[0]}</span><span class="val">${(Number(r[1])/total*100).toFixed(1)}%</span></div>`).join('');
  el.innerHTML = `<div class="segBar">${bar}</div><div class="legendList">${legend}</div>`;
}

function fillDemo(elId, rows){
  const el = document.getElementById(elId);
  if(!rows || !rows.length){ el.innerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  const grouped = {};
  rows.forEach(r=>{ const age=r[0], gender=r[1], pct=r[2]; grouped[age]=grouped[age]||{}; grouped[age][gender]=pct; });
  el.innerHTML = '';
  Object.keys(grouped).sort().forEach(age=>{
    const male = grouped[age].MALE||0, female = grouped[age].FEMALE||0;
    const div = document.createElement('div');
    div.className = 'srcbar';
    div.innerHTML = `<div class="row"><span>${age.replace('age','')}</span><span>M ${male.toFixed(1)}% · F ${female.toFixed(1)}%</span></div><div class="bg"><div class="fg" style="width:${(male+female).toFixed(0)}%;background:linear-gradient(90deg,#3ea6ff,#ff5fa2)"></div></div>`;
    el.appendChild(div);
  });
}
</script>
</body>
</html>
