<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KBS Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0f0f0f; --card:#1c1c1c; --card2:#181818; --text:#fff; --sub:#9c9c9c;
    --accent:#22c1e0; --red:#ff0033; --border:#2a2a2a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:30px;}
  header{display:flex; align-items:center; gap:10px; padding:16px; position:sticky; top:0; background:var(--bg); z-index:10; border-bottom:1px solid var(--border);}
  header img{width:30px; height:30px; border-radius:7px;}
  header h1{font-size:19px; margin:0; font-weight:700;}
  .backbtn{font-size:22px; background:none; border:none; color:var(--text); cursor:pointer; padding:0 6px;}

  #channelScroller{display:flex; gap:14px; overflow-x:auto; padding:14px 16px; border-bottom:1px solid var(--border);}
  #channelScroller::-webkit-scrollbar{display:none;}
  .chip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; cursor:pointer; opacity:.55;}
  .chip.active{opacity:1;}
  .chip img{width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid transparent;}
  .chip.active img{border-color:var(--accent);}
  .chip span{font-size:11px; color:var(--sub); max-width:64px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.active span{color:var(--text);}
  .addchip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; cursor:pointer;}
  .addchip .plus{width:50px; height:50px; border-radius:50%; border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--sub);}

  main{padding:16px;}
  .subcount{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .subcount img{width:56px; height:56px; border-radius:50%;}
  .subcount .num{font-size:22px; font-weight:700;}
  .subcount .lbl{font-size:13px; color:var(--sub);}

  h2.section{font-size:16px; margin:22px 0 10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .card{background:var(--card); border-radius:10px; padding:14px;}
  .card .k{font-size:13px; color:var(--sub); margin-bottom:6px;}
  .card .v{font-size:20px; font-weight:700;}

  .vidrow{display:flex; gap:12px; background:var(--card); border-radius:10px; padding:10px; margin-bottom:10px; cursor:pointer;}
  .vidrow img{width:64px; height:64px; object-fit:cover; border-radius:6px; flex-shrink:0;}
  .vidrow .info{flex:1; min-width:0;}
  .vidrow .title{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .vidrow .meta{font-size:12px; color:var(--sub); margin-top:4px;}
  .rank{font-size:11px; background:#2a2a2a; padding:2px 6px; border-radius:5px; color:var(--accent); margin-left:6px;}

  .statline{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);}
  .statline .k{color:var(--sub); font-size:13px;}
  .statline .v{font-size:15px; font-weight:600;}

  .tabs{display:flex; gap:8px; margin:14px 0;}
  .tab{background:var(--card2); border:none; color:var(--sub); padding:7px 14px; border-radius:16px; font-size:13px; cursor:pointer;}
  .tab.active{background:#fff; color:#000; font-weight:600;}

  svg{width:100%; height:180px;}
  .srcbar{margin:10px 0;}
  .srcbar .row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .srcbar .bg{height:5px; background:#2a2a2a; border-radius:3px; overflow:hidden;}
  .srcbar .fg{height:100%; background:var(--accent);}

  .center{text-align:center; padding:60px 20px; color:var(--sub);}
  .btn{background:var(--accent); color:#000; border:none; padding:12px 22px; border-radius:24px; font-weight:700; font-size:15px; cursor:pointer;}
  .btn.outline{background:none; border:1px solid var(--border); color:var(--text);}
  .hidden{display:none !important;}
  .note{font-size:11px; color:var(--sub); margin-top:6px;}
  .spin{width:22px;height:22px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:20px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <button class="backbtn hidden" id="backBtn" onclick="goHome()">←</button>
  <img src="icon.png" onerror="this.style.display='none'">
  <h1 id="headerTitle">KBS Dashboard</h1>
</header>

<div id="channelScroller"></div>

<main id="main">
  <div class="center" id="emptyState">
    <p>Koi channel connect nahi hai abhi.</p>
    <button class="btn" onclick="addChannel()">+ Connect Channel</button>
  </div>
</main>

<script>
const CLIENT_ID = "73063724182-v0htom68s2qjlilcmjec5hodric4qf7s.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly https://www.googleapis.com/auth/yt-analytics-monetary.readonly";

let channels = JSON.parse(localStorage.getItem("kbs_channels") || "[]"); // {token,expiry,id,title,thumb,subs,views}
let activeIdx = channels.length ? 0 : null;
let tokenClient;

window.onload = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: onToken
  });
  renderChips();
  if(activeIdx !== null) loadChannel(activeIdx);
};

function addChannel(){
  tokenClient.requestAccessToken({ prompt: "consent" });
}

async function onToken(resp){
  if(resp.error){ alert("Login fail: "+resp.error); return; }
  const token = resp.access_token;
  const expiry = Date.now() + (resp.expires_in*1000);
  // fetch channel info
  const r = await fetch("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true", {
    headers:{Authorization:"Bearer "+token}
  });
  const d = await r.json();
  if(!d.items || !d.items.length){ alert("Channel data nahi mila"); return; }
  const c = d.items[0];
  const chan = {
    token, expiry,
    id: c.id,
    title: c.snippet.title,
    thumb: c.snippet.thumbnails.default.url,
    subs: c.statistics.subscriberCount,
    views: c.statistics.viewCount,
    uploadsPlaylist: c.contentDetails.relatedPlaylists.uploads
  };
  const existing = channels.findIndex(x=>x.id===chan.id);
  if(existing>=0) channels[existing]=chan; else channels.push(chan);
  saveChannels();
  renderChips();
  activeIdx = channels.findIndex(x=>x.id===chan.id);
  loadChannel(activeIdx);
}

function saveChannels(){
  localStorage.setItem("kbs_channels", JSON.stringify(channels));
}

function renderChips(){
  const el = document.getElementById("channelScroller");
  el.innerHTML = "";
  channels.forEach((c,i)=>{
    const chip = document.createElement("div");
    chip.className = "chip"+(i===activeIdx?" active":"");
    chip.innerHTML = `<img src="${c.thumb}"><span>${c.title}</span>`;
    chip.onclick = ()=>{ activeIdx=i; renderChips(); loadChannel(i); };
    el.appendChild(chip);
  });
  const add = document.createElement("div");
  add.className = "addchip";
  add.innerHTML = `<div class="plus">+</div><span>Add</span>`;
  add.onclick = addChannel;
  el.appendChild(add);
}

function goHome(){
  document.getElementById("backBtn").classList.add("hidden");
  document.getElementById("headerTitle").textContent = "KBS Dashboard";
  if(activeIdx!==null) loadChannel(activeIdx);
}

async function ensureToken(chan){
  if(chan.expiry > Date.now()+30000) return chan.token;
  // try silent refresh
  return new Promise((resolve)=>{
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback:(resp)=>{
        if(resp.error){ resolve(null); return; }
        chan.token = resp.access_token;
        chan.expiry = Date.now() + resp.expires_in*1000;
        saveChannels();
        resolve(chan.token);
      }
    });
    tc.requestAccessToken({prompt:""});
  });
}

async function loadChannel(idx){
  document.getElementById("emptyState").remove?.();
  const chan = channels[idx];
  const main = document.getElementById("main");
  main.innerHTML = `<div class="spin"></div>`;
  const token = await ensureToken(chan);
  if(!token){ main.innerHTML = `<div class="center">Session expired.<br><button class="btn" onclick="addChannel()">Reconnect ${chan.title}</button></div>`; return; }

  // analytics 28d
  const end = new Date().toISOString().slice(0,10);
  const start = new Date(Date.now()-28*86400000).toISOString().slice(0,10);
  let analytics = {views:0, estimatedMinutesWatched:0, subscribersGained:0, estimatedRevenue:0};
  try{
    const ar = await fetch(`https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==${chan.id}&startDate=${start}&endDate=${end}&metrics=views,estimatedMinutesWatched,subscribersGained,estimatedRevenue`, {headers:{Authorization:"Bearer "+token}});
    const ad = await ar.json();
    if(ad.rows && ad.rows[0]){
      const row = ad.rows[0];
      analytics = {views:row[0], estimatedMinutesWatched:row[1], subscribersGained:row[2], estimatedRevenue:row[3]};
    }
  }catch(e){}

  // recent videos
  let videos = [];
  try{
    const pr = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=6&playlistId=${chan.uploadsPlaylist}`, {headers:{Authorization:"Bearer "+token}});
    const pd = await pr.json();
    const ids = (pd.items||[]).map(i=>i.snippet.resourceId.videoId).join(",");
    if(ids){
      const vr = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${ids}`, {headers:{Authorization:"Bearer "+token}});
      const vd = await vr.json();
      videos = (vd.items||[]).sort((a,b)=>b.statistics.viewCount-a.statistics.viewCount);
    }
  }catch(e){}

  renderDashboard(chan, analytics, videos, token);
}

function fmt(n){
  n = Number(n||0);
  if(n>=1e6) return (n/1e6).toFixed(1)+"m";
  if(n>=1e3) return (n/1e3).toFixed(1)+"k";
  return n.toLocaleString();
}

function renderDashboard(chan, a, videos, token){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="subcount">
      <img src="${chan.thumb}">
      <div><div class="num">${fmt(chan.subs)}</div><div class="lbl">Total subscribers</div></div>
    </div>
    <h2 class="section">Channel analytics <span style="color:var(--sub);font-weight:400;font-size:13px;">(last 28 days)</span></h2>
    <div class="grid2">
      <div class="card"><div class="k">Views</div><div class="v">${fmt(a.views)}</div></div>
      <div class="card"><div class="k">Watch time (hrs)</div><div class="v">${fmt(a.estimatedMinutesWatched/60)}</div></div>
      <div class="card"><div class="k">Subscribers</div><div class="v">+${fmt(a.subscribersGained)}</div></div>
      <div class="card"><div class="k">Est. revenue</div><div class="v">$${fmt(a.estimatedRevenue)}</div></div>
    </div>
    <h2 class="section">Latest content</h2>
    <div id="vidlist"></div>
  `;
  const vl = document.getElementById("vidlist");
  videos.forEach((v,i)=>{
    const row = document.createElement("div");
    row.className = "vidrow";
    row.innerHTML = `
      <img src="${v.snippet.thumbnails.default.url}">
      <div class="info">
        <div class="title">${v.snippet.title}</div>
        <div class="meta">${fmt(v.statistics.viewCount)} views &nbsp;·&nbsp; ${fmt(v.statistics.likeCount)} likes <span class="rank">#${i+1} of ${videos.length}</span></div>
      </div>`;
    row.onclick = ()=> openVideo(chan, v, videos, token);
    vl.appendChild(row);
  });
}

async function openVideo(chan, video, allVideos, token){
  document.getElementById("backBtn").classList.remove("hidden");
  document.getElementById("headerTitle").textContent = "Video";
  const main = document.getElementById("main");
  main.innerHTML = `<div class="spin"></div>`;

  const pubDate = video.snippet.publishedAt.slice(0,10);
  const end = new Date().toISOString().slice(0,10);
  let series = [];
  let sources = [];
  try{
    const r1 = await fetch(`https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==${chan.id}&startDate=${pubDate}&endDate=${end}&metrics=views&dimensions=day&filters=video==${video.id}&sort=day`, {headers:{Authorization:"Bearer "+token}});
    const d1 = await r1.json();
    series = d1.rows || [];
  }catch(e){}
  try{
    const r2 = await fetch(`https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==${chan.id}&startDate=${pubDate}&endDate=${end}&metrics=views&dimensions=insightTrafficSourceType&filters=video==${video.id}&sort=-views&maxResults=5`, {headers:{Authorization:"Bearer "+token}});
    const d2 = await r2.json();
    sources = d2.rows || [];
  }catch(e){}

  const rank = allVideos.findIndex(v=>v.id===video.id)+1;
  const totalViews = series.reduce((s,r)=>s+Number(r[1]),0);

  main.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <img src="${video.snippet.thumbnails.medium.url}" style="width:100px;border-radius:8px;">
      <div><div style="font-weight:600;font-size:14px;">${video.snippet.title}</div>
      <div class="note">Rank #${rank} of ${allVideos.length} by views</div></div>
    </div>
    <div class="statline"><span class="k">Views</span><span class="v">${fmt(video.statistics.viewCount)}</span></div>
    <div class="statline"><span class="k">Likes</span><span class="v">${fmt(video.statistics.likeCount)}</span></div>
    <div class="statline"><span class="k">Comments</span><span class="v">${fmt(video.statistics.commentCount)}</span></div>
    <h2 class="section">Views since published</h2>
    <div id="chart"></div>
    <h2 class="section">Top sources</h2>
    <div id="sources"></div>
  `;
  drawLineChart(document.getElementById("chart"), series.map(r=>Number(r[1])));
  const srcEl = document.getElementById("sources");
  const maxV = Math.max(1,...sources.map(s=>Number(s[1])));
  sources.forEach(s=>{
    const pct = (Number(s[1])/maxV*100).toFixed(0);
    const div = document.createElement("div");
    div.className = "srcbar";
    div.innerHTML = `<div class="row"><span>${s[0]}</span><span>${fmt(s[1])}</span></div><div class="bg"><div class="fg" style="width:${pct}%"></div></div>`;
    srcEl.appendChild(div);
  });
}

function drawLineChart(container, data){
  if(!data.length){ container.innerHTML = `<div class="note">Data not available yet.</div>`; return; }
  const w=340,h=160,max=Math.max(...data,1);
  let cum=[],running=0;
  data.forEach(v=>{running+=v;cum.push(running);});
  const cmax = Math.max(...cum,1);
  const pts = cum.map((v,i)=> `${(i/(cum.length-1||1))*w},${h-(v/cmax*h)}`).join(" ");
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#22c1e0" stroke-width="2.5"/>
  </svg><div class="note">Total: ${fmt(cum[cum.length-1])} views</div>`;
}
</script>
</body>
</html>
