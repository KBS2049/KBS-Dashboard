<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KBS Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#0a0a0a; --card:#1a1a1a; --card2:#151515; --text:#fff; --sub:#9c9c9c;
    --accent:#22c1e0; --accent2:#5ee6ff; --border:#242424; --green:#3ddc84;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{padding-top:env(safe-area-inset-top); background:var(--bg);}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:40px; -webkit-font-smoothing:antialiased;}

  /* PIN screen */
  #pinScreen{position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #141414, #000 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100;}
  #pinScreen img{width:64px; height:64px; border-radius:16px; margin-bottom:18px; box-shadow:0 8px 30px rgba(34,193,224,0.25);}
  #pinScreen h2{font-weight:600; margin:0 0 26px; letter-spacing:0.3px;}
  .pinBoxes{display:flex; gap:14px;}
  .pinBoxes input{width:48px; height:56px; text-align:center; font-size:24px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:#fff; transition:border-color .15s, transform .1s;}
  .pinBoxes input:focus{border-color:var(--accent); outline:none; transform:scale(1.05);}
  #pinError{color:#ff5252; font-size:13px; margin-top:16px; height:16px;}

  header{display:flex; align-items:center; gap:10px; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); position:sticky; top:0; background:rgba(10,10,10,0.85); backdrop-filter:blur(12px); z-index:10; border-bottom:1px solid var(--border);}
  header img.logo{width:28px; height:28px; border-radius:7px;}
  header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:0.2px;}
  .backbtn{font-size:20px; background:none; border:none; color:var(--text); cursor:pointer; padding:2px 8px; border-radius:8px;}
  .backbtn:active{background:var(--card);}
  .refreshBtn{margin-left:auto; font-size:18px; background:var(--card); border:1px solid var(--border); color:var(--text); cursor:pointer; padding:7px 10px; line-height:1; border-radius:10px; transition:transform .2s;}
  .refreshBtn.spinning{animation:sp 0.7s linear infinite;}
  .refreshBtn:active{transform:scale(0.9);}

  #channelScroller{display:flex; gap:14px; overflow-x:auto; padding:14px 16px; border-bottom:1px solid var(--border);}
  #channelScroller::-webkit-scrollbar{display:none;}
  .chip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:60px; cursor:pointer; opacity:.5; transition:opacity .2s;}
  .chip.active{opacity:1;}
  .chip img{width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid transparent; transition:border-color .2s;}
  .chip.active img{border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,193,224,0.15);}
  .chip span{font-size:11px; color:var(--sub); max-width:60px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.active span{color:var(--text); font-weight:600;}
  .addchip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:60px; cursor:pointer;}
  .addchip .plus{width:48px; height:48px; border-radius:50%; border:1.5px dashed #3a3a3a; display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--sub);}

  main{padding:16px; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .subcount{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .subcount img{width:52px; height:52px; border-radius:50%; box-shadow:0 4px 16px rgba(0,0,0,0.4);}
  .subcount .num{font-size:21px; font-weight:700;}
  .subcount .lbl{font-size:12.5px; color:var(--sub);}

  .tabbar{display:flex; gap:6px; margin:14px 0 18px; background:var(--card2); padding:4px; border-radius:12px;}
  .tabbtn{flex:1; text-align:center; padding:8px 0; border-radius:9px; font-size:13px; font-weight:600; color:var(--sub); cursor:pointer; transition:all .15s;}
  .tabbtn.active{background:var(--card); color:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.3);}

  h2.section{font-size:15px; margin:22px 0 10px; font-weight:700; letter-spacing:0.2px;}
  .section .hint{color:var(--sub); font-weight:400; font-size:12px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .card{background:linear-gradient(155deg,#1d1d1d,#141414); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .card .k{font-size:12.5px; color:var(--sub); margin-bottom:6px;}
  .card .v{font-size:19px; font-weight:700;}
  .card .v.pos{color:var(--green);}

  .vidrow{display:flex; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:10px; cursor:pointer; transition:transform .12s, background .12s;}
  .vidrow:active{transform:scale(0.98); background:#202020;}
  .vidrow img{width:62px; height:62px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .vidrow .info{flex:1; min-width:0;}
  .vidrow .title{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.3;}
  .vidrow .meta{font-size:11.5px; color:var(--sub); margin-top:5px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .rank{font-size:10.5px; background:rgba(34,193,224,0.12); padding:2px 7px; border-radius:6px; color:var(--accent2); font-weight:600;}

  .statline{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border);}
  .statline .k{color:var(--sub); font-size:13px;}
  .statline .v{font-size:14.5px; font-weight:600;}

  .chartWrap{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 10px;}
  svg{width:100%; display:block;}
  .barChart{height:120px;}
  .lineChartH{height:150px;}

  .srcbar{margin:12px 0;}
  .srcbar .row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .srcbar .row .lbl{color:#ddd;}
  .srcbar .row .val{color:var(--sub); font-variant-numeric:tabular-nums;}
  .srcbar .bg{height:6px; background:#242424; border-radius:4px; overflow:hidden;}
  .srcbar .fg{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:4px; transition:width .5s ease;}

  .center{text-align:center; padding:60px 20px; color:var(--sub);}
  .btn{background:var(--accent); color:#000; border:none; padding:12px 22px; border-radius:24px; font-weight:700; font-size:15px; cursor:pointer;}
  .note{font-size:11px; color:var(--sub); margin-top:6px;}
  .skel{background:linear-gradient(90deg,#181818 25%,#222 37%,#181818 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:10px;}
  @keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}
  @keyframes sp{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="pinScreen">
  <img src="icon.png">
  <h2>Enter PIN</h2>
  <div class="pinBoxes">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
  </div>
  <div id="pinError"></div>
</div>

<header>
  <button class="backbtn hidden" id="backBtn" onclick="goHome()">←</button>
  <img class="logo" src="icon.png" onerror="this.style.display='none'">
  <h1 id="headerTitle">KBS Dashboard</h1>
  <button class="refreshBtn" id="refreshBtn" onclick="refreshCurrent()" title="Refresh">⟳</button>
</header>

<div id="channelScroller"></div>
<main id="main"></main>

<script>
const PIN = "4679";
const boxes = document.querySelectorAll('.pinBoxes input');
boxes[0].focus();
boxes.forEach((b,i)=>{
  b.addEventListener('input', ()=>{
    b.value = b.value.replace(/[^0-9]/g,'');
    if(b.value && i<boxes.length-1) boxes[i+1].focus();
    if([...boxes].every(x=>x.value.length===1)) checkPin();
  });
  b.addEventListener('keydown', (e)=>{
    if(e.key==='Backspace' && !b.value && i>0) boxes[i-1].focus();
  });
});
function checkPin(){
  const entered = [...boxes].map(b=>b.value).join('');
  if(entered === PIN){
    document.getElementById('pinScreen').style.display='none';
    init();
  } else {
    document.getElementById('pinError').textContent = 'Galat PIN';
    boxes.forEach(b=>b.value='');
    boxes[0].focus();
  }
}

let channels = [];
let activeIdx = null;
let currentView = 'dashboard';
let currentVideoCtx = null;
let activeTab = 'overview';
let lastChanData = null;

function refreshCurrent(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const done = ()=> btn.classList.remove('spinning');
  if(currentView==='video' && currentVideoCtx){
    openVideo(currentVideoCtx.chan, currentVideoCtx.video, currentVideoCtx.allVideos).then(done);
  } else if(activeIdx!==null){
    loadChannel(activeIdx).then(done);
  } else { done(); }
}

async function init(){
  channels = await (await fetch('/api/channels', {cache:'no-store'})).json();
  activeIdx = channels.length ? 0 : null;
  renderChips();
  if(activeIdx!==null) loadChannel(activeIdx);
  else document.getElementById('main').innerHTML = `<div class="center"><p>Koi channel connect nahi hai.</p><button class="btn" onclick="location.href='/api/login'">+ Connect Channel</button></div>`;
}

function renderChips(){
  const el = document.getElementById('channelScroller');
  el.innerHTML = '';
  channels.forEach((c,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip'+(i===activeIdx?' active':'');
    chip.innerHTML = `<img src="${c.thumb}"><span>${c.title}</span>`;
    chip.onclick = ()=>{ activeIdx=i; activeTab='overview'; renderChips(); loadChannel(i); };
    el.appendChild(chip);
  });
  const add = document.createElement('div');
  add.className = 'addchip';
  add.innerHTML = `<div class="plus">+</div><span>Add</span>`;
  add.onclick = ()=> location.href='/api/login';
  el.appendChild(add);
}

function goHome(){
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('headerTitle').textContent = 'KBS Dashboard';
  currentView = 'dashboard';
  if(activeIdx!==null) loadChannel(activeIdx);
}

function fmt(n){
  n = Number(n||0);
  if(n>=1e6) return (n/1e6).toFixed(1)+'m';
  if(n>=1e3) return (n/1e3).toFixed(1)+'k';
  return n.toLocaleString();
}
function fmtDuration(sec){
  if(!sec) return '—';
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}
function skeleton(){
  return `<div class="skel" style="height:52px;border-radius:50%;width:52px;margin-bottom:16px;"></div>
  <div class="grid2">
    <div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div>
    <div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div>
  </div>
  <div class="skel" style="height:160px;margin-top:20px;"></div>`;
}

async function loadChannel(idx){
  currentView = 'dashboard';
  const chan = channels[idx];
  const main = document.getElementById('main');
  main.innerHTML = skeleton();
  const d = await (await fetch('/api/data?channelId='+chan.id, {cache:'no-store'})).json();
  lastChanData = { chan, d };
  renderDashboard(chan, d);
}

function switchTab(tab){
  activeTab = tab;
  renderDashboard(lastChanData.chan, lastChanData.d);
}

function renderDashboard(chan, d){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="subcount">
      <img src="${d.thumb}">
      <div><div class="num">${fmt(d.subs)}</div><div class="lbl">Total subscribers · ${fmt(d.videoCount)} videos</div></div>
    </div>
    <div class="tabbar">
      <div class="tabbtn ${activeTab==='overview'?'active':''}" onclick="switchTab('overview')">Overview</div>
      <div class="tabbtn ${activeTab==='audience'?'active':''}" onclick="switchTab('audience')">Audience</div>
      <div class="tabbtn ${activeTab==='content'?'active':''}" onclick="switchTab('content')">Content</div>
    </div>
    <div id="tabBody"></div>
    <div class="note" style="text-align:center;margin-top:16px;">Updated ${timeAgo(d.fetchedAt)} · YouTube processes analytics with a 24–48h delay</div>
  `;
  const body = document.getElementById('tabBody');
  if(activeTab==='overview') body.innerHTML = overviewHTML(d);
  else if(activeTab==='audience') body.innerHTML = audienceHTML(d);
  else body.innerHTML = contentHTML(d);

  if(activeTab==='overview'){
    drawBarChart(document.getElementById('dailyChart'), d.dailyViews.map(r=>Number(r[1])), d.dailyViews.map(r=>r[0]));
  }
  if(activeTab==='audience'){
    fillBars('srcBox', d.trafficSources);
    fillBars('devBox', d.devices);
    fillBars('geoBox', d.countries);
    fillBars('subBox', d.subscribedStatus.map(r=>[r[0]==='SUBSCRIBED'?'Subscribed':'Not subscribed', r[1]]));
    fillDemo('demoBox', d.demographics);
  }
  if(activeTab==='content'){
    const vl = document.getElementById('vidlist');
    d.videos.forEach((v,i)=>{
      const row = document.createElement('div');
      row.className = 'vidrow';
      row.innerHTML = `
        <img src="${v.snippet.thumbnails.default.url}">
        <div class="info">
          <div class="title">${v.snippet.title}</div>
          <div class="meta"><span>${fmt(v.statistics.viewCount)} views</span><span>·</span><span>${fmt(v.statistics.likeCount)} likes</span><span class="rank">#${v.rankByViews} of ${d.videos.length}</span></div>
        </div>`;
      row.onclick = ()=> openVideo(chan, v, d.videos);
      vl.appendChild(row);
    });
    fillBars('playlistBox', d.playlists);
  }
}

function overviewHTML(d){
  return `
    <div class="grid2">
      <div class="card"><div class="k">Views (28d)</div><div class="v">${fmt(d.analytics.views)}</div></div>
      <div class="card"><div class="k">Watch time (hrs)</div><div class="v">${fmt(d.analytics.estimatedMinutesWatched/60)}</div></div>
      <div class="card"><div class="k">Subscribers gained</div><div class="v pos">+${fmt(d.analytics.subscribersGained)}</div></div>
      <div class="card"><div class="k">Est. revenue</div><div class="v">$${fmt(d.analytics.estimatedRevenue)}</div></div>
      <div class="card"><div class="k">Likes</div><div class="v">${fmt(d.analytics.likes)}</div></div>
      <div class="card"><div class="k">Comments</div><div class="v">${fmt(d.analytics.comments)}</div></div>
    </div>
    <h2 class="section">Daily views <span class="hint">last 28 days</span></h2>
    <div class="chartWrap"><svg id="dailyChart" class="barChart" viewBox="0 0 340 120" preserveAspectRatio="none"></svg></div>
    <h2 class="section">Lifetime</h2>
    <div class="grid2">
      <div class="card"><div class="k">Total views</div><div class="v">${fmt(d.totalViews)}</div></div>
      <div class="card"><div class="k">Total videos</div><div class="v">${fmt(d.videoCount)}</div></div>
    </div>
  `;
}

function audienceHTML(d){
  return `
    <h2 class="section">Traffic sources</h2>
    <div class="chartWrap" id="srcBox"></div>
    <h2 class="section">Top countries</h2>
    <div class="chartWrap" id="geoBox"></div>
    <h2 class="section">Devices</h2>
    <div class="chartWrap" id="devBox"></div>
    <h2 class="section">Subscribed vs not</h2>
    <div class="chartWrap" id="subBox"></div>
    <h2 class="section">Age &amp; gender</h2>
    <div class="chartWrap" id="demoBox"></div>
  `;
}

function contentHTML(d){
  return `
    <div id="vidlist"></div>
    <h2 class="section">Playlists by views</h2>
    <div class="chartWrap" id="playlistBox"></div>
  `;
}

function fillBars(elId, rows){
  const el = document.getElementById(elId);
  if(!el) return;
  if(!rows || !rows.length){ el.innerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  el.innerHTML = '';
  const maxV = Math.max(1,...rows.map(s=>Number(s[1])));
  rows.forEach(s=>{
    const pct = (Number(s[1])/maxV*100).toFixed(0);
    const div = document.createElement('div');
    div.className = 'srcbar';
    div.innerHTML = `<div class="row"><span class="lbl">${s[0]}</span><span class="val">${fmt(s[1])}</span></div><div class="bg"><div class="fg" style="width:0%"></div></div>`;
    el.appendChild(div);
    requestAnimationFrame(()=>{ div.querySelector('.fg').style.width = pct+'%'; });
  });
}

function fillDemo(elId, rows){
  const el = document.getElementById(elId);
  if(!rows || !rows.length){ el.innerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  const grouped = {};
  rows.forEach(r=>{
    const age = r[0], gender = r[1], pct = r[2];
    grouped[age] = grouped[age] || {};
    grouped[age][gender] = pct;
  });
  el.innerHTML = '';
  Object.keys(grouped).forEach(age=>{
    const male = grouped[age].MALE || 0, female = grouped[age].FEMALE || 0;
    const div = document.createElement('div');
    div.className = 'srcbar';
    div.innerHTML = `<div class="row"><span class="lbl">${age.replace('age','')}</span><span class="val">M ${male.toFixed(1)}% · F ${female.toFixed(1)}%</span></div>
      <div class="bg"><div class="fg" style="width:${(male+female).toFixed(0)}%"></div></div>`;
    el.appendChild(div);
  });
}

function drawBarChart(svg, data, labels){
  if(!svg) return;
  if(!data.length){ svg.parentElement.innerHTML = `<div class="note">Data not available yet.</div>`; return; }
  const w=340,h=120,max=Math.max(...data,1),n=data.length,bw=w/n*0.6,gap=w/n;
  let bars = data.map((v,i)=>{
    const bh = (v/max)*(h-10);
    const x = i*gap + (gap-bw)/2;
    return `<rect x="${x}" y="${h-bh}" width="${bw}" height="0" rx="2" fill="url(#grad)"><animate attributeName="height" from="0" to="${bh}" dur="0.5s" fill="freeze"/><animate attributeName="y" from="${h}" to="${h-bh}" dur="0.5s" fill="freeze"/></rect>`;
  }).join('');
  svg.innerHTML = `<defs><linearGradient id="grad" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#22c1e0"/><stop offset="100%" stop-color="#5ee6ff"/>
  </linearGradient></defs>${bars}`;
}

function drawLineChart(container, data){
  if(!data.length){ container.innerHTML = `<div class="note">Data not available yet.</div>`; return; }
  const w=340,h=150;
  let cum=[],running=0;
  data.forEach(v=>{running+=v;cum.push(running);});
  const cmax = Math.max(...cum,1);
  const pts = cum.map((v,i)=> `${(i/(cum.length-1||1))*w},${h-(v/cmax*h)}`).join(' ');
  const areaPts = `0,${h} ${pts} ${w},${h}`;
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c1e0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c1e0" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${areaPts}" fill="url(#areaGrad)"/>
    <polyline points="${pts}" fill="none" stroke="#22c1e0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg><div class="note">Total: ${fmt(cum[cum.length-1])} views since published</div>`;
}

async function openVideo(chan, video, allVideos){
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('headerTitle').textContent = 'Video';
  currentView = 'video';
  currentVideoCtx = { chan, video, allVideos };
  const main = document.getElementById('main');
  main.innerHTML = skeleton();

  const q = new URLSearchParams({ channelId: chan.id, videoId: video.id, publishedAt: video.snippet.publishedAt });
  const vd = await (await fetch('/api/video?'+q, {cache:'no-store'})).json();
  const rank = video.rankByViews;
  const e = vd.extra || {};

  main.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <img src="${video.snippet.thumbnails.medium.url}" style="width:100px;border-radius:10px;">
      <div><div style="font-weight:600;font-size:14px;line-height:1.35;">${video.snippet.title}</div>
      <div class="note">Rank #${rank} of ${allVideos.length} recent videos</div>
      <div class="note">Published ${new Date(video.snippet.publishedAt).toLocaleDateString()}</div></div>
    </div>
    <h2 class="section">Overview</h2>
    <div class="statline"><span class="k">Views</span><span class="v">${fmt(video.statistics.viewCount)}</span></div>
    <div class="statline"><span class="k">Likes</span><span class="v">${fmt(video.statistics.likeCount)}</span></div>
    <div class="statline"><span class="k">Comments</span><span class="v">${fmt(video.statistics.commentCount)}</span></div>
    <div class="statline"><span class="k">Watch time (hrs)</span><span class="v">${fmt((e.estimatedMinutesWatched||0)/60)}</span></div>
    <div class="statline"><span class="k">Avg view duration</span><span class="v">${fmtDuration(e.averageViewDuration)}</span></div>
    <div class="statline"><span class="k">Avg % viewed</span><span class="v">${e.averageViewPercentage ? e.averageViewPercentage.toFixed(1)+'%' : '—'}</span></div>
    <div class="statline"><span class="k">Subscribers gained</span><span class="v pos" style="color:var(--green);">+${fmt(e.subscribersGained)}</span></div>
    <div class="statline"><span class="k">Shares</span><span class="v">${fmt(e.shares)}</span></div>
    <div class="statline"><span class="k">Est. revenue</span><span class="v">$${fmt(e.estimatedRevenue)}</span></div>
    <h2 class="section">Views since published</h2>
    <div class="chartWrap" id="chart"></div>
    <h2 class="section">Top sources</h2>
    <div class="chartWrap" id="sources"></div>
    <h2 class="section">Devices</h2>
    <div class="chartWrap" id="devices"></div>
    <h2 class="section">Top countries</h2>
    <div class="chartWrap" id="countries"></div>
    <div class="note" style="text-align:center;margin-top:14px;">Updated ${timeAgo(vd.fetchedAt)} · YouTube processes analytics with a 24–48h delay</div>
  `;
  drawLineChart(document.getElementById('chart'), vd.series.map(r=>Number(r[1])));
  fillBars('sources', vd.sources);
  fillBars('devices', vd.devices);
  fillBars('countries', vd.countries);
}
</script>
</body>
</html>
