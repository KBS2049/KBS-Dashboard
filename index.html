<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KBS Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0f0f0f;--surface:#181818;--surface2:#212121;--surface3:#272727;--text:#f1f1f1;--muted:#aaa;--line:#303030;--red:#ff0033;--blue:#3ea6ff;--green:#2ba640;--yellow:#f9ab00;--purple:#a970ff;--max:1480px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;color:inherit}body{min-height:100vh}
#pinScreen{position:fixed;inset:0;background:#0f0f0f;display:flex;align-items:center;justify-content:center;z-index:99}.pinCard{width:min(420px,calc(100% - 32px));text-align:center;padding:36px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.pinCard img{width:72px;height:72px;border-radius:12px;margin-bottom:18px}.pinCard h2{margin:0 0 8px;font-size:22px}.pinCard p{color:var(--muted);font-size:13px;margin:0 0 24px}.pinBoxes{display:flex;justify-content:center;gap:10px}.pinBoxes input{width:54px;height:58px;border:1px solid #3d3d3d;border-radius:8px;background:#111;color:#fff;text-align:center;font-size:24px;outline:none}.pinBoxes input:focus{border-color:#fff}.pinError{height:20px;margin-top:12px;color:#ff6b6b;font-size:13px}
.app{display:none;min-height:100vh}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:20px;background:rgba(15,15,15,.96);position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px;min-width:205px}.brand img{width:32px;height:32px;border-radius:7px}.brand strong{font-size:18px;letter-spacing:-.2px}.hamb{display:none;border:0;background:none;font-size:22px}.channelSelect{height:38px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:#fff;padding:0 12px;outline:none}.topSpacer{flex:1}.refresh{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 14px;font-size:14px}.refresh.spin{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}.sidebar{border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:64px;height:calc(100vh - 64px);background:#111}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:none;text-align:left;padding:11px 14px;border-radius:8px;color:#c7c7c7;font-size:14px;display:flex;align-items:center;gap:12px}.nav button:hover{background:#1d1d1d}.nav button.active{background:#292929;color:#fff;font-weight:600}.navIcon{width:19px;text-align:center;font-size:16px}.sideDivider{height:1px;background:var(--line);margin:15px 8px}.sideTitle{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#777;padding:0 14px 8px}.main{min-width:0}.page{max-width:var(--max);margin:0 auto;padding:28px 34px 60px}.pageHead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:7px}.pageHead h1{font-size:28px;line-height:1.15;margin:0;font-weight:600;letter-spacing:-.5px}.range{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 12px;color:#ddd;font-size:13px}
.channelHero{display:flex;align-items:center;gap:16px;margin-bottom:25px}.channelHero img{width:56px;height:56px;border-radius:50%;object-fit:cover}.channelHero .name{font-size:18px;font-weight:600}.channelHero .sub{color:var(--muted);font-size:13px;margin-top:4px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:24px}.metric{padding:18px 20px;border-right:1px solid var(--line);min-width:0}.metric:last-child{border-right:0}.metric .label{font-size:13px;color:var(--muted);margin-bottom:9px}.metric .value{font-size:25px;font-weight:600;letter-spacing:-.3px}.metric .hint{font-size:12px;color:#777;margin-top:6px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}.tabs button{border:0;background:none;color:#aaa;padding:13px 20px 12px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}.tabs button:first-child{padding-left:0}.tabs button.active{color:#fff;border-color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}.cardHead{padding:18px 20px 8px}.cardHead h2{margin:0;font-size:16px;font-weight:500}.cardHead p{margin:5px 0 0;color:#888;font-size:12px}.cardBody{padding:12px 20px 20px}.chartBox{height:285px;position:relative}.chartBox svg{width:100%;height:100%;display:block}.chartGrid{stroke:#2b2b2b;stroke-width:1}.chartLabel{fill:#777;font-size:10px}.line{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.area{fill:rgba(62,166,255,.10)}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#777;font-size:13px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.legendRow{display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.legendRow span:last-child{color:#aaa}.list{padding:0 20px 12px}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.thumb{width:72px;height:42px;border-radius:5px;object-fit:cover;background:#222;flex:none}.rankNum{width:20px;color:#777;font-size:12px;text-align:center}.rowMain{min-width:0;flex:1}.rowTitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowMeta{font-size:11px;color:#777;margin-top:4px}.rowValue{font-size:13px;color:#ddd;white-space:nowrap}.barRow{margin:0 0 17px}.barTop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.barTop span:last-child{color:#aaa}.barBg{height:7px;background:#2b2b2b;border-radius:99px;overflow:hidden}.barFill{height:100%;background:#fff;border-radius:99px}.bigStat{font-size:28px;font-weight:600;margin:3px 0 16px}.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}.mini{padding:14px 0;border-top:1px solid var(--line)}.mini:nth-child(odd){margin-right:18px}.miniLabel{font-size:12px;color:#888}.miniValue{font-size:16px;margin-top:5px}.note{font-size:11px;color:#777;line-height:1.5}.loading{padding:70px;text-align:center;color:#777}.skeleton{height:16px;border-radius:5px;background:linear-gradient(90deg,#1b1b1b,#292929,#1b1b1b);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}
.videoCard{display:flex;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);cursor:pointer}.videoCard:last-child{border-bottom:0}.videoCard:hover{background:#1d1d1d}.videoCard img{width:150px;height:84px;object-fit:cover;border-radius:5px;background:#222;flex:none}.videoTitle{font-size:14px;font-weight:500;line-height:1.35}.videoMeta{display:flex;gap:15px;flex-wrap:wrap;color:#888;font-size:12px;margin-top:8px}.rankBadge{font-size:11px;background:#2b2b2b;border-radius:4px;padding:3px 6px;color:#ddd}
.videoHero{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-bottom:25px}.videoHero img{width:100%;border-radius:8px}.videoHero h1{font-size:22px;margin:0 0 12px;line-height:1.3}.videoHero .meta{color:#888;font-size:13px}.back{border:0;background:none;color:#aaa;padding:0;margin-bottom:14px;font-size:13px}.back:hover{color:#fff}
@media(max-width:1000px){.layout{grid-template-columns:76px 1fr}.sidebar{padding:16px 8px}.sideTitle,.nav button span:not(.navIcon){display:none}.nav button{justify-content:center;padding:12px}.brand{min-width:auto}.brand strong{display:none}.channelSelect{min-width:190px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media(max-width:700px){.topbar{height:58px;padding:0 12px;gap:10px}.hamb{display:block}.brand{display:none}.channelSelect{flex:1;min-width:0;height:36px}.layout{display:block;min-height:calc(100vh - 58px)}.sidebar{position:fixed;z-index:40;left:0;top:58px;bottom:0;width:230px;height:auto;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.sideTitle,.nav button span:not(.navIcon){display:block}.nav button{justify-content:flex-start}.page{padding:22px 14px 50px}.pageHead{align-items:flex-start;flex-direction:column}.pageHead h1{font-size:24px}.grid{display:block}.card{margin-bottom:16px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:15px}.metric .value{font-size:21px}.tabs button{padding:12px 16px}.tabs button:first-child{padding-left:0}.videoHero{display:block}.videoHero img{margin-bottom:16px}.videoCard img{width:112px;height:63px}.videoCard{gap:11px;padding:14px}.chartBox{height:230px}.legend{grid-template-columns:1fr}.channelHero img{width:48px;height:48px}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="pinScreen"><div class="pinCard"><img src="icon.png" onerror="this.style.display='none'"><h2>Welcome to KBS Studio</h2><p>Enter your 4-digit PIN to continue</p><div class="pinBoxes"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><div class="pinError" id="pinError"></div></div></div>
<div class="app" id="app">
<header class="topbar"><button class="hamb" onclick="toggleSidebar()">☰</button><div class="brand"><img src="icon.png" onerror="this.style.display='none'"><strong>KBS Studio</strong></div><select id="channelSelect" class="channelSelect" onchange="switchChannel(this.value)"></select><div class="topSpacer"></div><button class="refresh" id="refreshBtn" onclick="refreshCurrent()">↻ Refresh</button></header>
<div class="layout"><aside class="sidebar" id="sidebar"><div class="sideTitle">Studio</div><nav class="nav"><button data-tab="overview" onclick="setTab('overview')" class="active"><span class="navIcon">⌂</span><span>Overview</span></button><button data-tab="content" onclick="setTab('content')"><span class="navIcon">▶</span><span>Content</span></button><button data-tab="reach" onclick="setTab('reach')"><span class="navIcon">⌁</span><span>Reach</span></button><button data-tab="engagement" onclick="setTab('engagement')"><span class="navIcon">◷</span><span>Engagement</span></button><button data-tab="audience" onclick="setTab('audience')"><span class="navIcon">◉</span><span>Audience</span></button><button data-tab="revenue" onclick="setTab('revenue')"><span class="navIcon">$</span><span>Revenue</span></button></nav><div class="sideDivider"></div><div class="sideTitle">Channel</div><nav class="nav"><button onclick="location.href='/api/login'"><span class="navIcon">＋</span><span>Add channel</span></button></nav></aside><main class="main" id="main"></main></div></div>
<script>
const PIN='4679';const boxes=[...document.querySelectorAll('.pinBoxes input')];let channels=[];let active=null;let data=null;let tab='overview';let videoData=null;
boxes[0].focus();boxes.forEach((b,i)=>{b.addEventListener('input',()=>{b.value=b.value.replace(/\D/g,'');if(b.value&&i<3)boxes[i+1].focus();if(boxes.every(x=>x.value))checkPin()});b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&i)boxes[i-1].focus()})});
function checkPin(){if(boxes.map(x=>x.value).join('')===PIN){document.getElementById('pinScreen').style.display='none';document.getElementById('app').style.display='block';init()}else{document.getElementById('pinError').textContent='Incorrect PIN';boxes.forEach(x=>x.value='');boxes[0].focus()}}
async function init(){try{channels=await fetch('/api/channels',{cache:'no-store'}).then(r=>r.json());if(!channels.length){renderEmpty();return}active=channels[0].id;renderChannelSelect();await loadChannel()}catch(e){renderError(e)}}
function renderChannelSelect(){const s=document.getElementById('channelSelect');s.innerHTML=channels.map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('');s.value=active}
async function switchChannel(id){active=id;tab='overview';document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));await loadChannel()}
async function loadChannel(){renderLoading();try{data=await fetch('/api/data?channelId='+encodeURIComponent(active),{cache:'no-store'}).then(r=>r.json());if(data.error)throw Error(data.error);render()}catch(e){renderError(e)}}
function refreshCurrent(){const b=document.getElementById('refreshBtn');b.classList.add('spin');loadChannel().finally(()=>b.classList.remove('spin'))}
function setTab(t){tab=t;document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.getElementById('sidebar').classList.remove('open');if(videoData){videoData=null}render()}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function render(){if(!data)return;const m=document.getElementById('main');const base=`<div class="page"><div class="pageHead"><div><div class="eyebrow">Channel analytics</div><h1>${titleFor(tab)}</h1></div><div class="range">Last 28 days</div></div><div class="channelHero"><img src="${safeImg(data.thumb)}"><div><div class="name">${esc(data.title||'Channel')}</div><div class="sub">${fmt(data.subs)} subscribers · ${fmt(data.videoCount)} videos · ${fmt(data.totalViews)} total views</div></div></div>${tab==='overview'?overview():tab==='content'?content():tab==='reach'?reach():tab==='engagement'?engagement():tab==='audience'?audience():revenue()}</div>`;m.innerHTML=base}
function titleFor(t){return({overview:'Channel overview',content:'Content performance',reach:'How viewers find your content',engagement:'Audience engagement',audience:'Your audience',revenue:'Revenue'})[t]}
function metrics(items){return `<div class="metrics">${items.map(x=>`<div class="metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]||'Last 28 days'}</div></div>`).join('')}</div>`}
function overview(){const a=data.analytics||{};return metrics([['Views',fmt(a.views)],['Watch time',hours(a.estimatedMinutesWatched)],['Subscribers',signed(a.subscribersGained)],['Estimated revenue',money(a.estimatedRevenue)]])+`<div class="grid"><section class="card span8"><div class="cardHead"><h2>Views</h2><p>Daily views over the selected period</p></div><div class="cardBody"><div class="chartBox">${lineChart(data.dailyViews,'views')}</div></div></section><section class="card span4"><div class="cardHead"><h2>Key metrics</h2><p>Audience actions</p></div><div class="cardBody">${statGrid([['Likes',fmt(a.likes)],['Comments',fmt(a.comments)],['Shares',fmt(a.shares)],['Subscribers',signed(a.subscribersGained)]])}</div></section><section class="card span7"><div class="cardHead"><h2>Top content</h2><p>Your latest videos ranked by views</p></div>${videoList(data.videos||[])}</section><section class="card span5"><div class="cardHead"><h2>Traffic sources</h2><p>Where viewers found your content</p></div><div class="cardBody">${bars(data.trafficSources||[])}</div></section></div>`}
function content(){return `<div class="grid"><section class="card span12"><div class="cardHead"><h2>Latest content</h2><p>Compare your recent uploads at a glance</p></div>${videoList(data.videos||[],true)}</section><section class="card span7"><div class="cardHead"><h2>Views by day</h2><p>28-day performance trend</p></div><div class="cardBody"><div class="chartBox">${lineChart(data.dailyViews,'views')}</div></div></section><section class="card span5"><div class="cardHead"><h2>Playlists</h2><p>Views attributed to playlists</p></div><div class="cardBody">${bars(data.playlists||[])}</div></section></div>`}
function reach(){return metrics([['Views',fmt(data.analytics.views)],['Traffic sources',(data.trafficSources||[]).length],['Countries',(data.countries||[]).length],['External sources',(data.trafficSources||[]).filter(x=>String(x[0]).includes('EXT')).length]])+`<div class="grid"><section class="card span7"><div class="cardHead"><h2>How viewers found your content</h2><p>Top traffic source types</p></div><div class="cardBody">${bars(data.trafficSources||[],true)}</div></section><section class="card span5"><div class="cardHead"><h2>Top countries</h2><p>Views by geography</p></div><div class="cardBody">${bars(data.countries||[])}</div></section><section class="card span12"><div class="cardHead"><h2>Device type</h2><p>Views by device</p></div><div class="cardBody">${bars(data.devices||[])}</div></section></div>`}
function engagement(){const a=data.analytics||{};return metrics([['Watch time',hours(a.estimatedMinutesWatched)],['Likes',fmt(a.likes)],['Comments',fmt(a.comments)],['Shares',fmt(a.shares)]])+`<div class="grid"><section class="card span7"><div class="cardHead"><h2>Watch time trend</h2><p>Estimated minutes watched per day</p></div><div class="cardBody"><div class="chartBox">${lineChart(data.dailyViews,'views')}</div></div></section><section class="card span5"><div class="cardHead"><h2>Engagement metrics</h2><p>Channel-level actions</p></div><div class="cardBody">${statGrid([['Likes',fmt(a.likes)],['Comments',fmt(a.comments)],['Shares',fmt(a.shares)],['Subscribers gained',signed(a.subscribersGained)]])}</div></section></div>`}
function audience(){return metrics([['Subscribers',fmt(data.subs)],['Monthly views',fmt(data.analytics.views)],['Top country',(data.countries||[])[0]?.[0]||'—'],['Top device',(data.devices||[])[0]?.[0]||'—']])+`<div class="grid"><section class="card span6"><div class="cardHead"><h2>Audience by country</h2><p>Top geographies by views</p></div><div class="cardBody">${bars(data.countries||[])}</div></section><section class="card span6"><div class="cardHead"><h2>Audience by device</h2><p>Where viewers watch</p></div><div class="cardBody">${bars(data.devices||[])}</div></section><section class="card span12"><div class="cardHead"><h2>Subscriber status</h2><p>Views from subscribers vs non-subscribers</p></div><div class="cardBody">${bars(data.subscribedStatus||[])}</div></section></div>`}
function revenue(){const a=data.analytics||{};return metrics([['Estimated revenue',money(a.estimatedRevenue)],['Views',fmt(a.views)],['Watch time',hours(a.estimatedMinutesWatched)],['Subscribers',signed(a.subscribersGained)]])+`<div class="grid"><section class="card span8"><div class="cardHead"><h2>Revenue overview</h2><p>Estimated revenue reported by YouTube Analytics</p></div><div class="cardBody"><div class="bigStat">${money(a.estimatedRevenue)}</div><div class="note">Revenue values are estimates from the connected YouTube Analytics account and may change as data is finalized.</div></div></section><section class="card span4"><div class="cardHead"><h2>Channel totals</h2></div><div class="cardBody">${statGrid([['Views',fmt(data.totalViews)],['Subscribers',fmt(data.subs)],['Videos',fmt(data.videoCount)],['Revenue',money(a.estimatedRevenue)]])}</div></section></div>`}
function videoList(vs,large=false){if(!vs.length)return `<div class="loading">No video data available.</div>`;return `<div>${vs.map((v,i)=>`<div class="videoCard" onclick="openVideo('${esc(v.id)}')"><img src="${safeImg(v.snippet?.thumbnails?.medium?.url||v.snippet?.thumbnails?.default?.url)}"><div class="rowMain"><div class="videoTitle">${esc(v.snippet?.title||'Untitled')}</div><div class="videoMeta"><span>${fmt(v.statistics?.viewCount)} views</span><span>${fmt(v.statistics?.likeCount)} likes</span><span>${fmt(v.statistics?.commentCount)} comments</span><span>${date(v.snippet?.publishedAt)}</span><span class="rankBadge">#${v.rankByViews||i+1} by views</span></div></div></div>`).join('')}</div>`}
async function openVideo(id){try{document.getElementById('main').innerHTML='<div class="loading">Loading video analytics…</div>';videoData=await fetch('/api/video?channelId='+encodeURIComponent(active)+'&videoId='+encodeURIComponent(id)+'&publishedAt='+encodeURIComponent((data.videos.find(v=>v.id===id)?.snippet?.publishedAt)||new Date().toISOString()),{cache:'no-store'}).then(r=>r.json());const v=data.videos.find(x=>x.id===id);renderVideo(v)}catch(e){renderError(e)}}
function renderVideo(v){const x=videoData||{};const e=x.extra||{};document.getElementById('main').innerHTML=`<div class="page"><button class="back" onclick="render()">← Back to ${titleFor(tab)}</button><div class="videoHero"><img src="${safeImg(v?.snippet?.thumbnails?.high?.url||v?.snippet?.thumbnails?.medium?.url)}"><div><h1>${esc(v?.snippet?.title||'Video analytics')}</h1><div class="meta">Published ${date(v?.snippet?.publishedAt)} · ${fmt(v?.statistics?.viewCount)} views · ${fmt(v?.statistics?.likeCount)} likes</div></div></div>${metrics([['Watch time',hours(e.estimatedMinutesWatched)],['Average view duration',duration(e.averageViewDuration)],['Average percentage viewed',pct(e.averageViewPercentage)],['Subscribers gained',signed(e.subscribersGained)]])}<div class="grid"><section class="card span8"><div class="cardHead"><h2>Views over time</h2><p>Daily performance since publication</p></div><div class="cardBody"><div class="chartBox">${lineChart(x.viewsSeries||[],'views')}</div></div></section><section class="card span4"><div class="cardHead"><h2>Video engagement</h2></div><div class="cardBody">${statGrid([['Likes',fmt(e.likes)],['Comments',fmt(e.comments)],['Shares',fmt(e.shares)],['Revenue',money(e.estimatedRevenue)]])}</div></section><section class="card span6"><div class="cardHead"><h2>Traffic sources</h2></div><div class="cardBody">${bars(x.sources||[])}</div></section><section class="card span6"><div class="cardHead"><h2>Top countries</h2></div><div class="cardBody">${bars(x.countries||[])}</div></section><section class="card span6"><div class="cardHead"><h2>Search terms</h2></div><div class="cardBody">${bars(x.searchTerms||[])}</div></section><section class="card span6"><div class="cardHead"><h2>External sites & apps</h2></div><div class="cardBody">${bars(x.externalApps||[])}</div></section></div></div>`}
function statGrid(a){return `<div class="statGrid">${a.map(x=>`<div class="mini"><div class="miniLabel">${x[0]}</div><div class="miniValue">${x[1]}</div></div>`).join('')}</div>`}
function bars(rows,percent=false){if(!rows||!rows.length)return '<div class="empty">No data available for this report.</div>';const vals=rows.map(r=>Number(r[1])||0),max=Math.max(...vals,1);return rows.slice(0,8).map(r=>{const val=Number(r[1])||0;return `<div class="barRow"><div class="barTop"><span>${esc(label(r[0]))}</span><span>${percent?pct(val):fmt(val)}</span></div><div class="barBg"><div class="barFill" style="width:${Math.max(2,val/max*100)}%"></div></div></div>`}).join('')}
function label(v){return String(v||'Unknown').replaceAll('_',' ').replaceAll('YT ','YouTube ')}
function lineChart(rows,key){if(!rows||!rows.length)return '<div class="empty">No chart data available.</div>';const pts=rows.map(r=>Number(r[1])||0),w=900,h=250,p=28,max=Math.max(...pts,1),min=Math.min(...pts,0),range=max-min||1;const xy=pts.map((v,i)=>[p+i*(w-2*p)/Math.max(pts.length-1,1),h-p-(v-min)/range*(h-2*p)]);const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');const area=path+' L '+xy.at(-1)[0]+' '+(h-p)+' L '+xy[0][0]+' '+(h-p)+' Z';const labels=rows.filter((_,i)=>i===0||i===rows.length-1||i===Math.floor(rows.length/2));return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${p}" y1="${p}" x2="${w-p}" y2="${p}" class="chartGrid"/><line x1="${p}" y1="${h/2}" x2="${w-p}" y2="${h/2}" class="chartGrid"/><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="chartGrid"/><path d="${area}" class="area"/><path d="${path}" class="line"/>${labels.map(r=>{const i=rows.indexOf(r),x=p+i*(w-2*p)/Math.max(pts.length-1,1);return `<text x="${x}" y="${h-7}" text-anchor="middle" class="chartLabel">${esc(String(r[0]).slice(5)||String(r[0]))}</text>`}).join('')}</svg>`}
function renderLoading(){document.getElementById('main').innerHTML='<div class="page"><div class="loading"><div class="skeleton" style="width:180px;margin:0 auto 12px"></div>Loading analytics…</div></div>'}
function renderEmpty(){document.getElementById('main').innerHTML='<div class="page"><div class="loading">No channel connected.<br><br><button class="refresh" onclick="location.href=\'/api/login\'">＋ Connect channel</button></div></div>'}
function renderError(e){document.getElementById('main').innerHTML='<div class="page"><div class="loading">Unable to load analytics right now.<br><br><button class="refresh" onclick="loadChannel()">Try again</button></div></div>';console.error(e)}
function fmt(n){const x=Number(n);return Number.isFinite(x)?x.toLocaleString('en-US'):'—'}function signed(n){const x=Number(n);return Number.isFinite(x)?(x>0?'+':'')+x.toLocaleString('en-US'):'—'}function money(n){const x=Number(n);return Number.isFinite(x)?'$'+x.toFixed(2):'$0.00'}function hours(n){const x=Number(n);return Number.isFinite(x)?(x/60).toLocaleString('en-US',{maximumFractionDigits:1})+' hrs':'—'}function pct(n){const x=Number(n);return Number.isFinite(x)?x.toFixed(1)+'%':'—'}function duration(n){const x=Number(n);if(!Number.isFinite(x))return'—';const s=Math.round(x),m=Math.floor(s/60),sec=String(s%60).padStart(2,'0');return m+':'+sec}function date(v){if(!v)return'—';return new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function safeImg(v){return v?esc(v):'icon.png'}
</script>
