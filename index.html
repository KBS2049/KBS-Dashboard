<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>html{padding-top:env(safe-area-inset-top);}</style>
<title>KBS Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#0f0f0f; --card:#1c1c1c; --card2:#181818; --text:#fff; --sub:#9c9c9c;
    --accent:#22c1e0; --border:#2a2a2a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:30px;}

  /* PIN screen */
  #pinScreen{position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100;}
  #pinScreen img{width:64px; height:64px; border-radius:14px; margin-bottom:18px;}
  #pinScreen h2{font-weight:600; margin:0 0 24px;}
  .pinBoxes{display:flex; gap:14px;}
  .pinBoxes input{width:48px; height:56px; text-align:center; font-size:24px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:#fff;}
  .pinBoxes input:focus{border-color:var(--accent); outline:none;}
  #pinError{color:#ff5252; font-size:13px; margin-top:16px; height:16px;}

  header{display:flex; align-items:center; gap:10px; padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); position:sticky; top:0; background:var(--bg); z-index:10; border-bottom:1px solid var(--border);}
  header img{width:30px; height:30px; border-radius:7px;}
  header h1{font-size:19px; margin:0; font-weight:700;}
  .backbtn{font-size:22px; background:none; border:none; color:var(--text); cursor:pointer; padding:0 6px;}
  .refreshBtn{margin-left:auto; font-size:20px; background:none; border:none; color:var(--text); cursor:pointer; padding:4px 8px; line-height:1;}
  .refreshBtn.spinning{animation:sp 0.7s linear infinite;}

  #channelScroller{display:flex; gap:14px; overflow-x:auto; padding:14px 16px; border-bottom:1px solid var(--border);}
  #channelScroller::-webkit-scrollbar{display:none;}
  .chip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; cursor:pointer; opacity:.55;}
  .chip.active{opacity:1;}
  .chip img{width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid transparent;}
  .chip.active img{border-color:var(--accent);}
  .chip span{font-size:11px; color:var(--sub); max-width:64px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.active span{color:var(--text);}
  .addchip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; cursor:pointer;}
  .addchip .plus{width:50px; height:50px; border-radius:50%; border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--sub);}

  main{padding:16px;}
  .subcount{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .subcount img{width:56px; height:56px; border-radius:50%;}
  .subcount .num{font-size:22px; font-weight:700;}
  .subcount .lbl{font-size:13px; color:var(--sub);}

  h2.section{font-size:16px; margin:22px 0 10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .card{background:var(--card); border-radius:10px; padding:14px;}
  .card .k{font-size:13px; color:var(--sub); margin-bottom:6px;}
  .card .v{font-size:20px; font-weight:700;}

  .vidrow{display:flex; gap:12px; background:var(--card); border-radius:10px; padding:10px; margin-bottom:10px; cursor:pointer;}
  .vidrow img{width:64px; height:64px; object-fit:cover; border-radius:6px; flex-shrink:0;}
  .vidrow .info{flex:1; min-width:0;}
  .vidrow .title{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .vidrow .meta{font-size:12px; color:var(--sub); margin-top:4px;}
  .rank{font-size:11px; background:#2a2a2a; padding:2px 6px; border-radius:5px; color:var(--accent); margin-left:6px;}

  .statline{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);}
  .statline .k{color:var(--sub); font-size:13px;}
  .statline .v{font-size:15px; font-weight:600;}

  svg{width:100%; height:180px;}
  .srcbar{margin:10px 0;}
  .srcbar .row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .srcbar .bg{height:5px; background:#2a2a2a; border-radius:3px; overflow:hidden;}
  .srcbar .fg{height:100%; background:var(--accent);}

  .center{text-align:center; padding:60px 20px; color:var(--sub);}
  .btn{background:var(--accent); color:#000; border:none; padding:12px 22px; border-radius:24px; font-weight:700; font-size:15px; cursor:pointer;}
  .note{font-size:11px; color:var(--sub); margin-top:6px;}
  .spin{width:22px;height:22px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:20px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="pinScreen">
  <img src="icon.png">
  <h2>Enter PIN</h2>
  <div class="pinBoxes">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
  </div>
  <div id="pinError"></div>
</div>

<header>
  <button class="backbtn hidden" id="backBtn" onclick="goHome()">←</button>
  <img src="icon.png" onerror="this.style.display='none'">
  <h1 id="headerTitle">KBS Dashboard</h1>
  <button class="refreshBtn" id="refreshBtn" onclick="refreshCurrent()" title="Refresh">⟳</button>
</header>

<div id="channelScroller"></div>
<main id="main"></main>

<script>
const PIN = "4679";
const boxes = document.querySelectorAll('.pinBoxes input');
boxes[0].focus();
boxes.forEach((b,i)=>{
  b.addEventListener('input', ()=>{
    b.value = b.value.replace(/[^0-9]/g,'');
    if(b.value && i<boxes.length-1) boxes[i+1].focus();
    if([...boxes].every(x=>x.value.length===1)) checkPin();
  });
  b.addEventListener('keydown', (e)=>{
    if(e.key==='Backspace' && !b.value && i>0) boxes[i-1].focus();
  });
});
function checkPin(){
  const entered = [...boxes].map(b=>b.value).join('');
  if(entered === PIN){
    document.getElementById('pinScreen').style.display='none';
    init();
  } else {
    document.getElementById('pinError').textContent = 'Galat PIN';
    boxes.forEach(b=>b.value='');
    boxes[0].focus();
  }
}

let channels = [];
let activeIdx = null;
let currentView = 'dashboard'; // 'dashboard' | 'video'
let currentVideoCtx = null; // {chan, video, allVideos}

function refreshCurrent(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const done = ()=> btn.classList.remove('spinning');
  if(currentView==='video' && currentVideoCtx){
    openVideo(currentVideoCtx.chan, currentVideoCtx.video, currentVideoCtx.allVideos).then(done);
  } else if(activeIdx!==null){
    loadChannel(activeIdx).then(done);
  } else { done(); }
}

async function init(){
  channels = await (await fetch('/api/channels', {cache:'no-store'})).json();
  activeIdx = channels.length ? 0 : null;
  renderChips();
  if(activeIdx!==null) loadChannel(activeIdx);
  else document.getElementById('main').innerHTML = `<div class="center"><p>Koi channel connect nahi hai.</p><button class="btn" onclick="location.href='/api/login'">+ Connect Channel</button></div>`;
}

function renderChips(){
  const el = document.getElementById('channelScroller');
  el.innerHTML = '';
  channels.forEach((c,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip'+(i===activeIdx?' active':'');
    chip.innerHTML = `<img src="${c.thumb}"><span>${c.title}</span>`;
    chip.onclick = ()=>{ activeIdx=i; renderChips(); loadChannel(i); };
    el.appendChild(chip);
  });
  const add = document.createElement('div');
  add.className = 'addchip';
  add.innerHTML = `<div class="plus">+</div><span>Add</span>`;
  add.onclick = ()=> location.href='/api/login';
  el.appendChild(add);
}

function goHome(){
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('headerTitle').textContent = 'KBS Dashboard';
  currentView = 'dashboard';
  if(activeIdx!==null) loadChannel(activeIdx);
}

function fmt(n){
  n = Number(n||0);
  if(n>=1e6) return (n/1e6).toFixed(1)+'m';
  if(n>=1e3) return (n/1e3).toFixed(1)+'k';
  return n.toLocaleString();
}

async function loadChannel(idx){
  currentView = 'dashboard';
  const chan = channels[idx];
  const main = document.getElementById('main');
  main.innerHTML = `<div class="spin"></div>`;
  const d = await (await fetch('/api/data?channelId='+chan.id, {cache:'no-store'})).json();
  renderDashboard(chan, d);
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}

function renderDashboard(chan, d){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="subcount">
      <img src="${d.thumb}">
      <div><div class="num">${fmt(d.subs)}</div><div class="lbl">Total subscribers</div></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="k">Lifetime views</div><div class="v">${fmt(d.totalViews)}</div></div>
      <div class="card"><div class="k">Total videos</div><div class="v">${fmt(d.videoCount)}</div></div>
    </div>
    <h2 class="section">Channel analytics <span style="color:var(--sub);font-weight:400;font-size:13px;">(last 28 days)</span></h2>
    <div class="grid2">
      <div class="card"><div class="k">Views</div><div class="v">${fmt(d.analytics.views)}</div></div>
      <div class="card"><div class="k">Watch time (hrs)</div><div class="v">${fmt(d.analytics.estimatedMinutesWatched/60)}</div></div>
      <div class="card"><div class="k">Subscribers</div><div class="v">+${fmt(d.analytics.subscribersGained)}</div></div>
      <div class="card"><div class="k">Est. revenue</div><div class="v">$${fmt(d.analytics.estimatedRevenue)}</div></div>
    </div>
    <h2 class="section">Latest content</h2>
    <div id="vidlist"></div>
    <div class="note" style="text-align:center;margin-top:10px;">Updated ${timeAgo(d.fetchedAt)} · YouTube processes analytics with a 24–48h delay</div>
  `;
  const vl = document.getElementById('vidlist');
  d.videos.forEach((v,i)=>{
    const row = document.createElement('div');
    row.className = 'vidrow';
    row.innerHTML = `
      <img src="${v.snippet.thumbnails.default.url}">
      <div class="info">
        <div class="title">${v.snippet.title}</div>
        <div class="meta">${fmt(v.statistics.viewCount)} views &nbsp;·&nbsp; ${fmt(v.statistics.likeCount)} likes <span class="rank">Rank #${v.rankByViews} of ${d.videos.length} by views</span></div>
      </div>`;
    row.onclick = ()=> openVideo(chan, v, d.videos);
    vl.appendChild(row);
  });
}

async function openVideo(chan, video, allVideos){
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('headerTitle').textContent = 'Video';
  currentView = 'video';
  currentVideoCtx = { chan, video, allVideos };
  const main = document.getElementById('main');
  main.innerHTML = `<div class="spin"></div>`;

  const q = new URLSearchParams({ channelId: chan.id, videoId: video.id, publishedAt: video.snippet.publishedAt });
  const vd = await (await fetch('/api/video?'+q, {cache:'no-store'})).json();
  const rank = video.rankByViews;
  const e = vd.extra || {};

  main.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <img src="${video.snippet.thumbnails.medium.url}" style="width:100px;border-radius:8px;">
      <div><div style="font-weight:600;font-size:14px;">${video.snippet.title}</div>
      <div class="note">Rank #${rank} of ${allVideos.length} recent videos, by views</div>
      <div class="note">Published ${new Date(video.snippet.publishedAt).toLocaleDateString()}</div></div>
    </div>
    <h2 class="section">Overview</h2>
    <div class="statline"><span class="k">Views</span><span class="v">${fmt(video.statistics.viewCount)}</span></div>
    <div class="statline"><span class="k">Likes</span><span class="v">${fmt(video.statistics.likeCount)}</span></div>
    <div class="statline"><span class="k">Comments</span><span class="v">${fmt(video.statistics.commentCount)}</span></div>
    <div class="statline"><span class="k">Watch time (hrs)</span><span class="v">${fmt((e.estimatedMinutesWatched||0)/60)}</span></div>
    <div class="statline"><span class="k">Avg view duration</span><span class="v">${fmtDuration(e.averageViewDuration)}</span></div>
    <div class="statline"><span class="k">Avg % viewed</span><span class="v">${e.averageViewPercentage ? e.averageViewPercentage.toFixed(1)+'%' : '—'}</span></div>
    <div class="statline"><span class="k">Subscribers gained</span><span class="v">+${fmt(e.subscribersGained)}</span></div>
    <div class="statline"><span class="k">Shares</span><span class="v">${fmt(e.shares)}</span></div>
    <div class="statline"><span class="k">Est. revenue</span><span class="v">$${fmt(e.estimatedRevenue)}</span></div>
    <h2 class="section">Views since published</h2>
    <div id="chart"></div>
    <h2 class="section">Top sources</h2>
    <div id="sources"></div>
    <h2 class="section">Devices</h2>
    <div id="devices"></div>
    <div class="note" style="text-align:center;margin-top:10px;">Updated ${timeAgo(vd.fetchedAt)} · YouTube processes analytics with a 24–48h delay</div>
  `;
  drawLineChart(document.getElementById('chart'), vd.series.map(r=>Number(r[1])));
  fillBars('sources', vd.sources);
  fillBars('devices', vd.devices);
}

function fmtDuration(sec){
  if(!sec) return '—';
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function fillBars(elId, rows){
  const el = document.getElementById(elId);
  if(!rows || !rows.length){ el.innerHTML = `<div class="note">Not enough data yet.</div>`; return; }
  const maxV = Math.max(1,...rows.map(s=>Number(s[1])));
  rows.forEach(s=>{
    const pct = (Number(s[1])/maxV*100).toFixed(0);
    const div = document.createElement('div');
    div.className = 'srcbar';
    div.innerHTML = `<div class="row"><span>${s[0]}</span><span>${fmt(s[1])}</span></div><div class="bg"><div class="fg" style="width:${pct}%"></div></div>`;
    el.appendChild(div);
  });
}

function drawLineChart(container, data){
  if(!data.length){ container.innerHTML = `<div class="note">Data not available yet.</div>`; return; }
  const w=340,h=160;
  let cum=[],running=0;
  data.forEach(v=>{running+=v;cum.push(running);});
  const cmax = Math.max(...cum,1);
  const pts = cum.map((v,i)=> `${(i/(cum.length-1||1))*w},${h-(v/cmax*h)}`).join(' ');
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#22c1e0" stroke-width="2.5"/>
  </svg><div class="note">Total: ${fmt(cum[cum.length-1])} views</div>`;
}
</script>
</body>
</html>
